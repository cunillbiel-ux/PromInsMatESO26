<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduació 2026</title>
    <style>
        /* Fons negre absolut i tipografia Helvetica */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #eee;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Estils de la imatge superior */
        .top-image {
            max-width: 350px;
            /* Pots canviar la mida si ho necessites */
            width: 80%;
            margin-bottom: 40px;
            display: block;
        }

        /* Zona del compte enrere */
        #countdown-zone {
            text-align: center;
        }

        .success-msg {
            font-size: 18px;
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #4CAF50;
            display: inline-block;
        }

        h1 {
            font-weight: 300;
            font-size: 24px;
            margin-bottom: 20px;
            color: #ddd;
        }

        #countdown {
            font-size: 60px;
            font-weight: bold;
            color: #fff;
            transition: all 0.3s ease;
        }

        /* Efectes de l'últim minut */
        .large {
            font-size: 100px !important;
        }

        .yellow {
            color: #FFD700 !important;
        }

        .red-blink {
            color: #FF3333 !important;
            animation: blink 1s linear infinite;
        }

        @keyframes blink {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        /* Contenidor del nou vídeo */
        #video-container {
            display: none;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Botó de descàrrega */
        .download-btn {
            display: inline-block;
            margin-top: 25px;
            background-color: #4CAF50;
            color: white;
            padding: 12px 28px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            font-size: 15px;
            transition: background 0.2s, transform 0.1s;
            border: none;
            cursor: pointer;
        }

        .download-btn:hover {
            background-color: #45a049;
            transform: scale(1.02);
        }
    </style>
</head>

<body>

    <img src="https://res.cloudinary.com/dnc3jm7wk/image/upload/v1780610074/hsbe_cp4edd.png" alt="Graduació"
        class="top-image" id="top-image">

    <div id="countdown-zone">
        <div class="success-msg">Has entrat a l'enllaç correctament</div>
        <h1>Espera a que comenci la reproducció</h1>
        <div id="countdown">Carregant...</div>
    </div>

    <div id="video-container">

        <iframe
            src="https://player.cloudinary.com/embed/?cloud_name=dnc3jm7wk&public_id=GRADUACIO%CC%81_FINAL_1_yomiw5&autoplay=true"
            width="640" height="360"
            style="height: auto; width: 100%; aspect-ratio: 640 / 360; border: none; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.7);"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen frameborder="0"></iframe>

        <br>
        <a href="https://res.cloudinary.com/dnc3jm7wk/video/upload/fl_attachment/GRADUACIO%CC%81_FINAL_1_yomiw5.mp4"
            class="download-btn">
            Descarrega el Vídeo
        </a>
    </div>

    <script>
        // CONFIGURACIÓ: Any, Mes (0=Gen, 5=Juny), Dia, Hora, Minuts, Segons
        const targetDate = new Date(2026, 5, 5, 0, 2, 0).getTime();

        let timerInterval;

        function actualitzarRellotge() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            const countdownEl = document.getElementById("countdown");

            if (distance >= 0) {
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                const totalSeconds = Math.floor(distance / 1000);

                const displaySeconds = seconds < 10 ? "0" + seconds : seconds;
                countdownEl.innerHTML = minutes + "m " + displaySeconds + "s ";
                countdownEl.className = "";

                if (totalSeconds <= 10) {
                    countdownEl.classList.add("large", "red-blink");
                } else if (totalSeconds <= 30) {
                    countdownEl.classList.add("large", "yellow");
                } else if (totalSeconds < 60) {
                    countdownEl.classList.add("large");
                }
            } else {
                if (timerInterval) clearInterval(timerInterval);

                // Amaga el compte enrere i la imatge
                document.getElementById("countdown-zone").style.display = "none";
                document.getElementById("top-image").style.display = "none";

                // Mostra el contenidor del vídeo
                document.getElementById("video-container").style.display = "block";
            }
        }

        timerInterval = setInterval(actualitzarRellotge, 1000);
        actualitzarRellotge(); 
    </script>
</body>

</html>
