<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduació 2026</title>
    <style>
        /* Fons negre absolut i estructura de pantalla completa */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background: #000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #eee;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Imatge més ajustada */
        .top-image {
            max-width: 250px;
            width: 70%;
            margin-bottom: 20px;
            display: block;
        }

        /* Zona del compte enrere més compacta */
        #countdown-zone {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            /* Ajunta els elements interns */
        }

        .success-msg {
            font-size: 15px;
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #4CAF50;
        }

        h1 {
            font-weight: 300;
            font-size: 18px;
            margin: 0;
            color: #ddd;
        }

        #countdown {
            font-size: 60px;
            font-weight: bold;
            color: #fff;
            transition: all 0.3s ease;
            line-height: 1;
        }

        /* Efectes de l'últim minut */
        .large {
            font-size: 90px !important;
        }

        .yellow {
            color: #FFD700 !important;
        }

        .red-blink {
            color: #FF3333 !important;
            animation: blink 1s linear infinite;
        }

        @keyframes blink {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        /* Contenidor del vídeo ocupant tota la pantalla */
        #video-container {
            display: none;
            width: 100vw;
            height: 100vh;
            padding: 0;
            margin: 0;
            background: #000;
        }

        /* Iframe fluid adaptat a mòbil vertical */
        iframe {
            width: 100%;
            height: calc(100vh - 80px);
            /* Ocupa tota la pantalla menys l'espai del botó inferior */
            border: none;
            display: block;
        }

        /* Contenidor del botó de descàrrega */
        .download-wrapper {
            height: 80px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .download-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            font-size: 15px;
            transition: background 0.2s;
            border: none;
        }

        .download-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

    <img src="https://res.cloudinary.com/dnc3jm7wk/image/upload/v1780610074/hsbe_cp4edd.png" alt="Graduació"
        class="top-image" id="top-image">

    <div id="countdown-zone">
        <div class="success-msg">Has entrat a l'enllaç correctament</div>
        <h1>Espera a que comenci la reproducció</h1>
        <div id="countdown">Carregant...</div>
    </div>

    <div id="video-container">
        <iframe
            src="https://player.cloudinary.com/embed/?cloud_name=dnc3jm7wk&public_id=GRADUACIO%CC%81_FINAL_1_yomiw5&autoplay=true"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen frameborder="0"></iframe>

        <div class="download-wrapper">
            <a href="https://res.cloudinary.com/dnc3jm7wk/video/upload/fl_attachment/GRADUACIO%CC%81_FINAL_1_yomiw5.mp4"
                class="download-btn">
                Descarrega el Vídeo
            </a>
        </div>
    </div>

    <script>
        // CONFIGURACIÓ: Any, Mes (0=Gen, 5=Juny), Dia, Hora, Minuts, Segons
        const targetDate = new Date(2026, 5, 5, 0, 7, 0).getTime();

        let timerInterval;

        function actualitzarRellotge() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            const countdownEl = document.getElementById("countdown");

            if (distance >= 0) {
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                const totalSeconds = Math.floor(distance / 1000);

                const displaySeconds = seconds < 10 ? "0" + seconds : seconds;
                countdownEl.innerHTML = minutes + "m " + displaySeconds + "s ";
                countdownEl.className = "";

                if (totalSeconds <= 10) {
                    countdownEl.classList.add("large", "red-blink");
                } else if (totalSeconds <= 30) {
                    countdownEl.classList.add("large", "yellow");
                } else if (totalSeconds < 60) {
                    countdownEl.classList.add("large");
                }
            } else {
                if (timerInterval) clearInterval(timerInterval);

                document.getElementById("countdown-zone").style.display = "none";
                document.getElementById("top-image").style.display = "none";

                // Mostrar el vídeo com a block permet que el height ocupi el 100% de la pantalla
                document.getElementById("video-container").style.display = "block";
            }
        }

        timerInterval = setInterval(actualitzarRellotge, 1000);
        actualitzarRellotge(); 
    </script>
</body>

</html>
