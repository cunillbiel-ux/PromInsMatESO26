<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Graduació 2026</title>
    <style>
        /* Fons negre absolut i estructura fixada al 100% real */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #eee;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .top-image {
            max-width: 250px;
            width: 65%;
            margin-bottom: 30px;
            display: block;
        }

        #countdown-zone {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 95%;
        }

        .success-msg {
            font-size: 16px;
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
            padding: 10px 18px;
            border-radius: 6px;
            border: 1px solid #4CAF50;
        }

        h1 {
            font-weight: 300;
            font-size: 20px;
            margin: 0;
            color: #ddd;
            margin-top: 10px;
        }

        #countdown {
            font-size: clamp(70px, 22vw, 130px);
            font-weight: bold;
            color: #fff;
            transition: all 0.3s ease;
            line-height: 1;
            margin-top: 10px;
        }

        .large {
            font-size: clamp(90px, 28vw, 150px) !important;
        }

        .yellow {
            color: #FFD700 !important;
        }

        .red-blink {
            color: #FF3333 !important;
            animation: blink 1s linear infinite;
        }

        @keyframes blink {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        /* Nova estructura Flexbox per al contenidor */
        #video-container {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: #000;
        }

        /* El vídeo ocupa l'espai restant de forma dinàmica */
        iframe {
            width: 100%;
            flex-grow: 1;
            border: none;
            display: block;
        }

        /* Contenidor del botó adaptat perquè no s'amagui mai */
        .download-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            padding: 20px 0;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            flex-shrink: 0;
        }

        .download-btn {
            background-color: #4CAF50;
            color: white;
            padding: 14px 26px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            font-size: 16px;
            transition: background 0.2s;
            border: none;
        }

        .download-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

    <img src="https://res.cloudinary.com/dnc3jm7wk/image/upload/v1780610074/hsbe_cp4edd.png" alt="Graduació"
        class="top-image" id="top-image">

    <div id="countdown-zone">
        <div class="success-msg">Has entrat a l'enllaç correctament</div>
        <h1>Espera a que comenci la reproducció</h1>
        <div id="countdown">Carregant...</div>
    </div>

    <div id="video-container">
        <iframe
            src="https://player.cloudinary.com/embed/?cloud_name=dnc3jm7wk&public_id=GRADUACIO%CC%81_FINAL_1_yomiw5&autoplay=true"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen frameborder="0"></iframe>

        <div class="download-wrapper">
            <a href="https://res.cloudinary.com/dnc3jm7wk/video/upload/fl_attachment/GRADUACIO%CC%81_FINAL_1_yomiw5.mp4"
                class="download-btn">
                Descarrega el Vídeo
            </a>
        </div>
    </div>

    <script>
        const targetDate = new Date(2026, 5, 5, 0, 30, 0).getTime();

        let timerInterval;

        function actualitzarRellotge() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            const countdownEl = document.getElementById("countdown");

            if (distance >= 0) {
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                const totalSeconds = Math.floor(distance / 1000);

                const displaySeconds = seconds < 10 ? "0" + seconds : seconds;

                // CONDICIÓ PER MOSTRAR O AMAGAR ELS MINUTS
                if (minutes > 0) {
                    countdownEl.innerHTML = minutes + "m " + displaySeconds + "s ";
                } else {
                    countdownEl.innerHTML = seconds + "s ";
                }

                countdownEl.className = "";

                if (totalSeconds <= 10) {
                    countdownEl.classList.add("large", "red-blink");
                } else if (totalSeconds <= 30) {
                    countdownEl.classList.add("large", "yellow");
                } else if (totalSeconds < 60) {
                    countdownEl.classList.add("large");
                }
            } else {
                if (timerInterval) clearInterval(timerInterval);

                document.getElementById("countdown-zone").style.display = "none";
                document.getElementById("top-image").style.display = "none";
                document.getElementById("video-container").style.display = "flex";
            }
        }

        timerInterval = setInterval(actualitzarRellotge, 1000);
        actualitzarRellotge(); 
    </script>
</body>

</html>
