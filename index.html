<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduació 2026</title>
    <style>
        /* Fons negre absolut i centrat */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Zona del compte enrere */
        #countdown-zone {
            text-align: center;
        }

        .success-msg {
            font-size: 18px;
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #4CAF50;
            display: inline-block;
        }

        h1 {
            font-weight: 300;
            font-size: 24px;
            margin-bottom: 20px;
            color: #ddd;
        }

        #countdown {
            font-size: 60px;
            font-weight: bold;
            color: #fff;
            transition: all 0.3s ease;
        }

        .large {
            font-size: 100px !important;
        }

        .yellow {
            color: #FFD700 !important;
        }

        .red-blink {
            color: #FF3333 !important;
            animation: blink 1s linear infinite;
        }

        @keyframes blink {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        /* Contenidor del Vídeo de Cloudinary (Amagat al principi) */
        #video-container {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: #000;
        }

        /* L'iframe ocupa tota la pantalla */
        iframe {
            width: 100%;
            height: 90vh;
            /* Deixem un 10% a baix per al botó de descàrrega */
            border: none;
        }

        .download-zone {
            height: 10vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        .download-btn {
            background-color: #4CAF50;
            color: white;
            padding: 8px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

    <div id="countdown-zone">
        <div class="success-msg">✅ Has entrat a l'enllaç correctament</div>
        <h1>Espera a que comenci la reproducció</h1>
        <div id="countdown">Carregant...</div>
    </div>

    <div id="video-container">
        <iframe
            src="https://player.cloudinary.com/embed/?cloud_name=dnc3jm7wk&public_id=Vi%CC%81deo_Graduacio%CC%81_1_cccau6&autoplay=true"
            allow="autoplay; fullscreen; encrypted-media" allowfullscreen>
        </iframe>

        <div class="download-zone">
            <a href="https://res.cloudinary.com/dnc3jm7wk/video/upload/fl_attachment/Vídeo_Graduació_1_cccau6.mp4"
                class="download-btn">
                📥 Descarregar Vídeo de la Graduació
            </a>
        </div>
    </div>

    <script>
        // Mantenim el truc de la URL perquè puguis canviar l'hora a l'instant des de l'enllaç
        // Si no poses res a la URL, per defecte anirà a les 21:50 d'avui
        let hora = 21;
        let minuto = 50;

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('h')) hora = parseInt(urlParams.get('h'));
        if (urlParams.has('m')) minuto = parseInt(urlParams.get('m'));

        const targetDate = new Date(2026, 5, 4, 7, 37, 0).getTime();

        let timerInterval;

        function actualitzarRellotge() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            const countdownEl = document.getElementById("countdown");

            if (distance >= 0) {
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                const totalSeconds = Math.floor(distance / 1000);

                const displaySeconds = seconds < 10 ? "0" + seconds : seconds;
                countdownEl.innerHTML = minutes + "m " + displaySeconds + "s ";
                countdownEl.className = "";

                // Efectes de colors de l'últim minut
                if (totalSeconds <= 10) {
                    countdownEl.classList.add("large", "red-blink");
                } else if (totalSeconds <= 30) {
                    countdownEl.classList.add("large", "yellow");
                } else if (totalSeconds < 60) {
                    countdownEl.classList.add("large");
                }
            } else {
                // QUAN S'ACABA EL TEMPS:
                if (timerInterval) clearInterval(timerInterval);

                // Amaguem el rellotge i mostrem el contenidor del vídeo
                document.getElementById("countdown-zone").style.display = "none";
                document.getElementById("video-container").style.display = "block";
            }
        }

        timerInterval = setInterval(actualitzarRellotge, 1000);
        actualitzarRellotge(); 
    </script>
</body>

</html>
